# Cabeçalhos de segurança.
#
# Fica num arquivo à parte porque, no nginx, um `add_header` dentro de um
# `location` APAGA os add_header herdados do `server`. Incluir este snippet em
# cada location garante que os cabeçalhos estejam em todas as respostas.
#
# HSTS (Strict-Transport-Security) não fica aqui: ele só faz sentido sobre HTTPS,
# então deve ser configurado no Ingress, que é quem termina o TLS.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# CSP: só carrega scripts do próprio site; estilos e fontes também do Google Fonts
# (usado no index.html). Se adicionar um serviço externo (analytics, imagens de
# outro domínio, API), libere o domínio na diretiva correspondente.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

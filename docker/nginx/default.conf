# Site estático do Currículo Online.
#
# TLS/HTTPS NÃO é tratado aqui: no cluster, quem termina o TLS é o Ingress
# (ou o load balancer). Este servidor só fala HTTP puro dentro do cluster.

# Não registra as sondas do Kubernetes no log de acesso (seriam milhares de linhas).
map $request_uri $loggable {
    ~^/healthz  0;
    default     1;
}

server {
    listen 8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout json_combined if=$loggable;

    # Atrás de um Ingress o nginx não sabe o host/porta públicos. Redirecionamentos
    # relativos evitam respostas do tipo "Location: http://pod:8080/...".
    absolute_redirect off;

    # Sonda de liveness/readiness do Kubernetes.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Arquivos gerados pelo Vite têm hash no nome (index-BQr3gDlm.js):
    # se o conteúdo muda, o nome muda — então podem ficar em cache "para sempre".
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Imagens e ícones de public/ (foto-perfil.jpg, favicon.svg…) não têm hash:
    # cache curto, para uma foto nova aparecer em até 1 dia.
    location ~* \.(?:jpe?g|png|gif|webp|avif|svg|ico|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # index.html sempre revalidado: garante que o visitante pegue o deploy novo.
    location / {
        # O site é uma página única com âncoras (#sobre, #contato…), sem rotas no
        # cliente. Por isso caminho inexistente responde 404 de verdade.
        # Se um dia adicionar React Router, troque `=404` por `/index.html`.
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
}

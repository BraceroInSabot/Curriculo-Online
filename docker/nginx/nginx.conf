# Configuração principal do nginx para rodar em container/pod.
#
# Tudo que o nginx precisa escrever fica em /tmp. No Kubernetes, monte um emptyDir
# em /tmp e use readOnlyRootFilesystem: true (veja docs/DEPLOY.md).

# Um worker basta para um site estático. `auto` usaria o número de CPUs do NÓ,
# não o limite de CPU do pod — num nó com 16 núcleos abriria 16 workers à toa.
# Para aguentar mais tráfego, aumente as réplicas (ou use um HPA), não os workers.
worker_processes 1;

error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Arquivos temporários fora do sistema de arquivos somente-leitura.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Não divulga a versão do nginx em cabeçalhos e páginas de erro.
    server_tokens off;

    # Logs de acesso em JSON (uma linha por requisição) na saída padrão:
    # fáceis de ler com `kubectl logs` e de indexar (Loki, ELK, CloudWatch…).
    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"x_forwarded_for":"$http_x_forwarded_for",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"status":$status,'
            '"bytes":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"referer":"$http_referer",'
            '"user_agent":"$http_user_agent"'
        '}';

    # Compressão para texto. Imagens (jpg/png) já são comprimidas.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/css
        text/plain
        application/javascript
        application/json
        image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
